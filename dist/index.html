<!DOCTYPE html>
<html lang="nl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Hertaler</title>

  <!-- Externe bibliotheken -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --surface2:#22263a;
      --border:  #2e3350;
      --accent:  #6c63ff;
      --accent2: #a78bfa;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --success: #34d399;
      --warning: #fbbf24;
      --error:   #f87171;
      --radius:  14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── TOPBAR ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: flex-end;
      gap: .4rem; margin-bottom: 1.2rem;
    }
    .flag-btn {
      background: var(--surface2);
      border: 2px solid transparent;
      border-radius: 8px; padding: .3rem .55rem;
      font-size: 1.3rem; cursor: pointer;
      transition: all .2s; line-height: 1;
    }
    .flag-btn.active { border-color: var(--accent); background: var(--surface); }
    .flag-btn:hover:not(.active) { border-color: var(--border); }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 2.5rem; }
    header h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); margin-top: .5rem; font-size: .95rem; }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.75rem;
      width: 100%; max-width: 720px; margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: 1rem; font-weight: 700; color: var(--accent2);
      margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem;
    }

    /* ── MODE TABS ── */
    .mode-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .mode-tab {
      flex: 1; min-width: 140px; padding: .6rem 1rem;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted);
      cursor: pointer; font-size: .85rem; font-weight: 600;
      text-align: center; transition: all .2s;
    }
    .mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mode-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* ── API SECTIES ── */
    .api-section    { display: none; flex-direction: column; gap: .75rem; }
    .api-section.visible { display: flex; }
    .webllm-section { display: none; flex-direction: column; gap: .75rem; }
    .webllm-section.visible { display: flex; }

    .api-row { display: flex; gap: .5rem; align-items: center; }
    .api-row label {
      font-size: .82rem; color: var(--muted);
      white-space: nowrap; min-width: 110px;
    }
    .api-row input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: .55rem .9rem; color: var(--text);
      font-size: .9rem; outline: none; font-family: monospace; transition: border .2s;
    }
    .api-row input:focus { border-color: var(--accent); }
    .model-select {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: .55rem .9rem; color: var(--text);
      font-size: .9rem; outline: none; cursor: pointer;
    }
    .info-box {
      background: var(--surface2); border-left: 3px solid var(--accent);
      border-radius: 6px; padding: .65rem 1rem;
      font-size: .82rem; color: var(--muted); line-height: 1.5;
    }
    .info-box a { color: var(--accent2); text-decoration: none; }
    .info-box a:hover { text-decoration: underline; }

    /* ── SLIDER ── */
    .slider-section { display: flex; flex-direction: column; gap: .6rem; }
    .slider-labels  { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
    .style-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      outline: none; cursor: pointer;
    }
    .style-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; border: 3px solid var(--accent);
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.4);
      transition: border-color .2s;
    }
    .style-slider::-webkit-slider-thumb:hover { border-color: var(--accent2); }
    .slider-value-display {
      text-align: center; font-size: .88rem; font-weight: 700;
      color: var(--text); background: var(--surface2);
      border-radius: 8px; padding: .4rem .9rem;
      width: fit-content; margin: 0 auto;
    }

    /* ── TAAL GRID ── */
    .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .lang-btn {
      padding: .55rem .5rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--muted); cursor: pointer;
      font-size: .85rem; font-weight: 600;
      text-align: center; transition: all .2s;
    }
    .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .lang-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* ── DROP ZONE ── */
    #dropzone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 3rem 2rem; text-align: center;
      cursor: pointer; transition: all .25s; position: relative;
    }
    #dropzone.dragover { border-color: var(--accent); background: rgba(108,99,255,.07); }
    #dropzone .drop-icon { font-size: 3rem; margin-bottom: .75rem; }
    #dropzone p { color: var(--muted); font-size: .95rem; }
    #dropzone strong { color: var(--text); }
    #dropzone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }

    /* ── PROGRESS ── */
    #progress-card { display: none; }
    #progress-card.visible { display: block; }
    .progress-steps { display: flex; flex-direction: column; gap: .6rem; }
    .step {
      display: flex; align-items: center; gap: .75rem;
      padding: .6rem .9rem; border-radius: 8px;
      background: var(--surface2); font-size: .88rem;
    }
    .step-icon  { font-size: 1.1rem; min-width: 1.5rem; text-align: center; }
    .step-label { flex: 1; color: var(--muted); }
    .step.active .step-label { color: var(--text); }
    .step.done   .step-label { color: var(--success); }
    .step.error-step .step-label { color: var(--error); }
    .progress-bar-wrap {
      background: var(--surface2); border-radius: 99px;
      height: 6px; margin-top: 1rem; overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px; width: 0%; transition: width .4s ease;
    }
    .log-box {
      background: var(--surface2); border-radius: 8px;
      padding: .75rem 1rem; font-size: .78rem;
      font-family: monospace; color: var(--muted);
      max-height: 120px; overflow-y: auto;
      margin-top: .75rem; line-height: 1.6;
    }

    /* ── KOSTEN METER ── */
    .cost-meter {
      margin-top: 1rem; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      padding: .9rem 1.1rem; display: none;
    }
    .cost-meter.visible { display: block; }
    .cost-meter-title {
      font-size: .78rem; color: var(--muted); margin-bottom: .6rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    }
    .cost-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem;
    }
    .cost-cell { background: var(--surface); border-radius: 8px; padding: .5rem .75rem; font-size: .82rem; }
    .cost-cell .cc-label { color: var(--muted); font-size: .74rem; margin-bottom: .15rem; }
    .cost-cell .cc-value { color: var(--text); font-weight: 700; font-size: .95rem; }
    .cost-cell .cc-value.highlight { color: var(--accent2); }
    .cost-cell .cc-value.green     { color: var(--success); }
    .balance-row {
      display: flex; gap: .5rem; margin-top: .6rem;
      align-items: center; flex-wrap: wrap;
    }
    .balance-badge {
      background: var(--surface); border-radius: 8px;
      padding: .4rem .75rem; font-size: .82rem;
      display: flex; gap: .4rem; align-items: center;
    }
    .balance-badge .bb-label { color: var(--muted); }
    .balance-badge .bb-val   { color: var(--text); font-weight: 700; }
    .balance-badge .bb-val.green { color: var(--success); }
    .balance-badge .bb-val.warn  { color: var(--warning); }

    /* ── DOWNLOAD ── */
    #download-card { display: none; }
    #download-card.visible { display: block; }
    .download-btn {
      display: inline-flex; align-items: center; gap: .6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; border-radius: 10px;
      padding: .85rem 2rem; font-size: 1rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: opacity .2s, transform .1s; margin-top: .75rem;
    }
    .download-btn:hover { opacity: .9; transform: translateY(-1px); }
    .download-btn:active { transform: translateY(0); }
    .download-btn.secondary {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    }
    .reset-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 10px;
      padding: .7rem 1.5rem; font-size: .9rem;
      cursor: pointer; margin-top: .5rem; transition: all .2s;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--text); }
    .stats-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: .75rem; }
    .stat {
      background: var(--surface2); border-radius: 8px;
      padding: .5rem .9rem; font-size: .82rem; color: var(--muted);
    }
    .stat strong { color: var(--text); }

    /* ── SPINNER & TOAST ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    #toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: .75rem 1.5rem;
      font-size: .88rem; transition: transform .3s ease;
      z-index: 999; max-width: 90vw; text-align: center;
    }
    #toast.show    { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--success); color: var(--success); }
    #toast.error   { border-color: var(--error);   color: var(--error); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- VLAGGEN TOPBAR -->
<div class="topbar">
  <button class="flag-btn active" data-ui-lang="nl" onclick="setUILang('nl')" title="Nederlands">🇳🇱</button>
  <button class="flag-btn" data-ui-lang="en" onclick="setUILang('en')" title="English">🇬🇧</button>
  <button class="flag-btn" data-ui-lang="pl" onclick="setUILang('pl')" title="Polski">🇵🇱</button>
  <button class="flag-btn" data-ui-lang="es" onclick="setUILang('es')" title="Español">🇪🇸</button>
</div>

<header>
  <h1>📖 Hertaler</h1>
  <p data-i18n="subtitle"></p>
</header>

<!-- STAP 1: AI-modus -->
<div class="card" id="ai-card">
  <h2>⚙️ <span data-i18n="step1_title"></span></h2>
  <div class="mode-tabs">
    <div class="mode-tab active" data-mode="ppq" onclick="setMode('ppq')">🔑 PPQ.ai API</div>
  </div>

  <!-- PPQ.ai -->
  <div class="api-section visible" id="ppq-section">
    <div class="api-row">
      <label>API Key:</label>
      <input type="password" id="ppq-key" placeholder="sk-..." autocomplete="off">
    </div>
    <div class="info-box">
      🔒 <span data-i18n="api_privacy"></span>
      <a href="https://ppq.ai" target="_blank">ppq.ai</a>
    </div>
  </div>
</div>

<!-- STAP 2: Taalstijl -->
<div class="card" id="style-card">
  <h2>🎚️ <span data-i18n="step2_title"></span></h2>
  <div class="slider-section">
    <div class="slider-labels" id="slider-labels"></div>
    <input type="range" id="style-slider" class="style-slider" min="1" max="5" value="3" step="1" oninput="updateSliderDisplay(this.value)">
    <div class="slider-value-display" id="slider-display"></div>
  </div>
</div>

<!-- STAP 3: Uitvoertaal -->
<div class="card" id="lang-card">
  <h2>🌍 <span data-i18n="step3_title"></span></h2>
  <div class="lang-grid" id="lang-grid"></div>
</div>

<!-- STAP 4: Bestand -->
<div class="card" id="upload-card">
  <h2>📂 <span data-i18n="step4_title"></span></h2>
  <div id="dropzone">
    <input type="file" id="file-input" accept=".epub,.html,.htm,.pdf,.vtt,.srt">
    <div class="drop-icon">📄</div>
    <p><strong data-i18n="drop_title"></strong><br><span data-i18n="drop_sub"></span></p>
    <p style="margin-top:.5rem;font-size:.8rem;color:var(--muted);" data-i18n="drop_formats"></p>
  </div>
</div>

<!-- STAP 5: Voortgang -->
<div class="card" id="progress-card">
  <h2>⚡ <span data-i18n="step5_title"></span></h2>
  <div class="progress-steps" id="steps-container"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="log-box" id="log-box"></div>

  <!-- Kosten meter -->
  <div class="cost-meter" id="cost-meter">
    <div class="cost-meter-title">💰 <span data-i18n="cost_title"></span></div>
    <div class="cost-grid">
      <div class="cost-cell">
        <div class="cc-label" data-i18n="cost_input_tokens"></div>
        <div class="cc-value highlight" id="cm-input-tokens">0</div>
      </div>
      <div class="cost-cell">
        <div class="cc-label" data-i18n="cost_output_tokens"></div>
        <div class="cc-value highlight" id="cm-output-tokens">0</div>
      </div>
      <div class="cost-cell">
        <div class="cc-label" data-i18n="cost_total_tokens"></div>
        <div class="cc-value" id="cm-total-tokens">0</div>
      </div>
      <div class="cost-cell">
        <div class="cc-label" data-i18n="cost_usd"></div>
        <div class="cc-value green" id="cm-cost-usd">$0.000000</div>
      </div>
    </div>
    <div class="balance-row" id="balance-row" style="display:none;">
      <div class="balance-badge">
        <span class="bb-label" data-i18n="cost_balance_before"></span>
        <span class="bb-val" id="cm-balance-before">—</span>
      </div>
      <span style="color:var(--muted);">→</span>
      <div class="balance-badge">
        <span class="bb-label" data-i18n="cost_balance_after"></span>
        <span class="bb-val green" id="cm-balance-after">—</span>
      </div>
      <div class="balance-badge">
        <span class="bb-label" data-i18n="cost_balance_spent"></span>
        <span class="bb-val warn" id="cm-balance-spent">—</span>
      </div>
    </div>
  </div>
</div>

<!-- STAP 6: Download -->
<div class="card" id="download-card">
  <h2>✅ <span data-i18n="step6_title"></span></h2>
  <p style="color:var(--muted);font-size:.9rem;" data-i18n="step6_sub"></p>
  <div class="stats-row" id="stats-row"></div>
  <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.75rem;">
    <a id="download-link" class="download-btn" download="">⬇️ <span data-i18n="btn_download"></span></a>
    <a id="download-link-alt" class="download-btn secondary" download="" style="display:none;">
      ⬇️ <span data-i18n="btn_download_alt"></span>
    </a>
    <button class="reset-btn" onclick="resetApp()">🔄 <span data-i18n="btn_reset"></span></button>
  </div>
</div>

<div id="toast"></div>

<!-- App scripts — volgorde is belangrijk -->
<script src="i18n.js"></script>
<script src="parsers.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>



</body></html>
